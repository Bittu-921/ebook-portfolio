<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#0b0f24;color:#eef1ff;line-height:1.5}
.box{max-width:420px;margin:12vh auto;padding:0 20px}.wrap{max-width:860px;margin:0 auto;padding:24px 20px}
h1{font-weight:500;letter-spacing:-.03em}input,textarea,button{width:100%;font:inherit;padding:12px 14px;margin:6px 0;border-radius:10px;border:1px solid #262e55;background:#121838;color:inherit}
button{background:#7b88ff;color:#0b0f24;border:0;font-weight:600;cursor:pointer}button:disabled{opacity:.6}.del{width:auto;background:none;color:#ff9bd6;border:1px solid #262e55}
.err{color:#ff9bd6;min-height:1.4em}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top button,.top a{width:auto;padding:8px 16px;color:inherit}
form{background:#0f1430;border:1px solid #262e55;border-radius:16px;padding:18px;margin:20px 0}label{font-size:.85rem;color:#9aa3c7;display:block;margin-top:8px}
.row{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid #262e55}.row div{flex:1}.row img{width:48px;height:68px;object-fit:cover;border-radius:4px}.row span{color:#9aa3c7;font-size:.9rem}</style></head><body>
<div id="lg" class="box"><h1>Admin login</h1><input id="u" placeholder="ID" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="current-password"><button id="go">Log in</button><p id="le" class="err"></p></div>
<div id="dash" class="wrap" hidden><div class="top"><h1>Dashboard</h1><div><a href="/" target="_blank">View site</a> <button id="out">Log out</button></div></div>
<form id="f"><h2>Add a book</h2><label>Title *</label><input name="title" required maxlength="200"><label>Author</label><input name="author" maxlength="120"><label>Genre</label><input name="genre" maxlength="60">
<label>Description</label><textarea name="description" rows="4" maxlength="2000"></textarea><label>ePub file *</label><input type="file" name="epub" accept=".epub" required><label>Cover image * (jpg, png, webp)</label><input type="file" name="cover" accept="image/*" required>
<button id="sv">Upload book</button><p id="fe" class="err"></p></form><h2>Published books</h2><div id="rows"></div></div>
<script src="/blob-client.js"></script>
<script>const $=i=>document.getElementById(i);
async function api(u,o){const r=await fetch(u,o),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Error');return d}
function show(a){$('lg').hidden=a;$('dash').hidden=!a;if(a)list()}
$('go').onclick=async()=>{try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:$('u').value,pass:$('p').value})});$('p').value='';$('le').textContent='';show(true)}catch(e){$('le').textContent=e.message}};
$('p').onkeydown=e=>{if(e.key==='Enter')$('go').click()};
$('out').onclick=async()=>{await api('/api/logout',{method:'POST'});show(false)};
async function list(){const b=await api('/api/books'),t=$('rows');t.textContent='';
 b.forEach(x=>{const r=document.createElement('div');r.className='row';const i=document.createElement('img');i.src=x.cover;i.alt='';const s=document.createElement('div'),n=document.createElement('b'),m=document.createElement('span');
  n.textContent=x.title;m.textContent=[x.author,x.genre].filter(Boolean).join(' · ');s.append(n,document.createElement('br'),m);
  const d=document.createElement('button');d.textContent='Delete';d.className='del';d.onclick=async()=>{if(confirm('Delete "'+x.title+'"?')){await api('/api/books/'+x.id,{method:'DELETE'});list()}};r.append(i,s,d);t.append(r)});
 if(!b.length)t.textContent='No books yet.'}
$('f').onsubmit=async e=>{e.preventDefault();const bt=$('sv'),fd=new FormData($('f')),ep=fd.get('epub'),cv=fd.get('cover');bt.disabled=true;$('fe').textContent='';
 const id=crypto.randomUUID(),ext=n=>(n.match(/\.(epub|jpe?g|png|webp)$/i)||['.bin'])[0].toLowerCase();
 const up=(file,name,type,label)=>BlobClient.upload('uploads/'+name,file,{access:'public',handleUploadUrl:'/api/upload',contentType:type,multipart:file.size>8e6,
   onUploadProgress:p=>{bt.textContent=label+' '+Math.round(p.percentage)+'%'}});
 try{const a=await up(ep,id+'.epub','application/epub+zip','Uploading ePub'),c=await up(cv,id+'-cover'+ext(cv.name),cv.type||'image/jpeg','Uploading cover');
  bt.textContent='Saving...';
  await api('/api/books',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:fd.get('title'),author:fd.get('author'),genre:fd.get('genre'),description:fd.get('description'),epubUrl:a.url,coverUrl:c.url})});
  $('f').reset();list()}catch(x){$('fe').textContent=x.message}bt.disabled=false;bt.textContent='Upload book'};
api('/api/me').then(m=>show(m.admin));</script></body></html>
